<style>:root{
  --bg:#0a0b0d;
  --panel:#13141a;
  --ink:#e8e9ed;        /* 16.2:1, titles and prose */
  --dim:#c9cbd4;        /* 12.2:1, blurbs and dates, was 8.2:1 and too soft */
  --muted:#a4a6b0;      /*  8.1:1, category, footer, chrome, was 6.0:1 */
  --accent:#5f82ff;      /*  5.7:1, fine for the 26px+ display text it carries */
  --accent-text:#7d99ff; /*  7.4:1, same hue, for links set at body size */
  --accent-soft:rgba(95,130,255,.14);
  --rule:#383b45;
  /* banner is 63 monospace columns; 63 x 0.6021em advance = 38em. A face with a
     different advance needs a different divisor, so it lives here as a number. */
  --banner-div:38;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.7;
}
::selection{background:var(--accent);color:#0a0b0d}

.wrap{max-width:780px;margin:0 auto;padding:48px 24px 120px}
.prompt{color:var(--muted)}
.prompt b{color:var(--accent);font-weight:500}

/* h1 has to outrank h2. At 15px/500 it was byte-identical to a project name and
   11px smaller than the section headings sitting underneath it. */
h1{font-size:30px;font-weight:700;color:var(--ink);margin:0 0 4px;letter-spacing:0.01em}
.role{color:var(--dim);font-size:16px;margin:0 0 6px}
.ascii{
  /* <pre> carries a UA font-family:monospace that beats inheritance, so the
     banner would silently render in the browser default instead of the site
     face, and the 0.602em advance the divisor assumes would not be guaranteed. */
  font-family:inherit;
  color:var(--accent);white-space:pre;line-height:1.3;
  /* the banner is the home page h1, so it resets the h1 weight: the letterforms
     are drawn by the art itself and a bold face just muddies the strokes */
  font-weight:400;
  margin:16px 0 28px;letter-spacing:0;
  /* Size the banner from the text measure so its right edge lands on the same
     line as the rules, instead of guessing a vw step that ignores the scrollbar
     and leaves a right gap. */
  font-size:min(19.26px, calc((100vw - 48px) / var(--banner-div)));
}
/* the plain-text name carries the heading; the art beside it is decorative, so
   on wide screens the text is present for assistive tech and copy/paste only */
h1.name{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}
@supports (container-type:inline-size){
  /* cqi is the wrap's content box: exact, and unaffected by scrollbar width. */
  .wrap{container-type:inline-size}
  .ascii{font-size:calc(100cqi / var(--banner-div))}
}
.meta{color:var(--muted);margin-bottom:24px;font-size:14px}
.meta span{margin-right:18px}

/* section boundaries must outweigh row separation, so the eye can chunk */
.block{margin:48px 0}
.block h2{
  font-size:26px;font-weight:700;color:var(--accent);
  margin:0 0 16px;letter-spacing:0.01em;
  display:flex;align-items:baseline;gap:10px;
}
.block h2::before{content:"## ";color:var(--muted);font-weight:400}

.row{
  /* a bare year is 4 characters (~31px); 90px left 59px of dead gutter between
     the date and the title it labels, on every one of ~50 rows */
  display:grid;grid-template-columns:60px 1fr 110px;gap:16px;
  padding:14px 0;border-bottom:1px dashed var(--rule);align-items:baseline;
}
.row:last-child{border-bottom:none}

/* the date is the scan axis, so it is brighter than the ancillary meta */
.row .yr{color:var(--dim);font-variant-numeric:tabular-nums;font-size:14px}
.row .what b{color:var(--ink);font-weight:500}
/* 13px sat below the psychophysical critical print size at desktop viewing
   distance, where reading speed falls off. Cap the measure so the home page's
   wider two-column rows don't run past a comfortable line. */
.row .what span{color:var(--dim);display:block;font-size:16px;margin-top:4px;line-height:1.6;max-width:70ch}
.row .where{color:var(--muted);text-align:right;font-size:14px}

a{color:var(--accent-text);text-decoration:none;border-bottom:1px dotted var(--accent-text)}
a:hover{background:var(--accent-soft)}

/* The prose is the only text on the page actually read rather than scanned, and
   monospace costs ~5% reading speed there (Mansfield/Legge 1996). IBM Plex Sans
   takes the lede and blurbs; everything structural stays mono. Plex Sans has a
   smaller x-height than JetBrains Mono, so it is set one step larger to match. */
.lede,.row .what span,.edu span{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
}
.lede{color:var(--ink);max-width:66ch;margin:0 0 18px;font-size:17px}
.lede a{color:var(--accent-text)}

.cursor{
  display:inline-block;width:9px;height:16px;background:var(--accent);
  vertical-align:middle;margin-left:2px;
  animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

hr{border:none;border-top:1px solid var(--rule);margin:32px 0}

footer{
  margin-top:48px;color:var(--muted);font-size:14px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
}

.articles .row{grid-template-columns:104px 1fr;gap:16px;padding:9px 0}

.edu{display:grid;grid-template-columns:60px 1fr;gap:16px;padding:14px 0}
.edu .yr{color:var(--dim);font-variant-numeric:tabular-nums;font-size:14px}
.edu b{color:var(--ink);font-weight:500}
.edu span{color:var(--dim);display:block;font-size:16px;margin-top:4px;line-height:1.6}

*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* jumping to a project from the home page lede should be visible on arrival */
html{scroll-behavior:smooth}
.row[id]{scroll-margin-top:24px}
.row:target{background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

@media (max-width:640px){
  /* 375px viewport minus 48px padding gave a 36ch measure, well under the 45ch
     comfort floor. Trimming the gutter and dropping a point buys ~43ch. */
  .wrap{padding:40px 16px 96px}
  body{font-size:15px}
  .lede{font-size:16px}
  .row .what span,.edu span{font-size:15px}
  .row .yr,.row .where,.edu .yr,.meta,footer{font-size:13px}
  /* .articles .row is (0,2,0); this override needs to match or it never applies */
  .row,.articles .row{grid-template-columns:56px 1fr;gap:8px}
  /* a full ISO date is 10 characters (~79px at 13px mono) and wraps in 56px */
  .articles .row{grid-template-columns:94px 1fr}
  /* the category still carries meaning, so it moves under the blurb rather than
     disappearing: same column, left aligned, dimmer than the blurb it follows */
  .row .where{grid-column:2;text-align:left;margin-top:6px}
  .edu{grid-template-columns:56px 1fr;gap:10px}
  /* the art renders at ~8px here and reads as texture, not a name: show the
     plain-text heading instead and drop the art entirely */
  .ascii{display:none}
  h1.name{
    position:static;width:auto;height:auto;overflow:visible;
    clip:auto;clip-path:none;white-space:normal;
    font-size:24px;color:var(--accent);margin:14px 0 18px;
  }
}
@media (prefers-reduced-motion:reduce){
  .cursor{animation:none}
}

/* a cv gets printed. Dark ground either burns toner or, with backgrounds off,
   prints pale gray on white at ~2.5:1. Invert, and expose link targets. */
@media print{
  :root{--bg:#fff;--ink:#111;--dim:#333;--muted:#555;--accent:#000;--rule:#bbb;--accent-soft:transparent}
  body{background:#fff;color:#111;font-size:10pt;line-height:1.45}
  .wrap{max-width:none;padding:0}
  .topbar,.jump,.cursor,.totop,.ascii{display:none}
  h1.name{position:static;width:auto;height:auto;overflow:visible;
    clip:auto;clip-path:none;white-space:normal;font-size:20pt;color:#000}
  a{color:#000;border-bottom:none;text-decoration:underline}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:8pt;color:#555;word-break:break-all}
  .block{margin:18pt 0;break-inside:avoid}
  .block h2{font-size:13pt;color:#000}
  .row{break-inside:avoid;padding:5pt 0}
}

/* ---- one top bar: shell prompt on the left, page tabs on the right ---- */
.topbar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
  gap:6px 22px;margin:0 0 30px;padding-bottom:14px;border-bottom:1px dashed var(--rule)}
.tabs{display:flex;gap:22px;font-size:14px}
.tabs a{color:var(--muted);border-bottom:none;position:relative;padding:2px 0}
.tabs a:hover{color:var(--accent-text)}
.tabs a.active{color:var(--ink)}
.tabs a.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent)}
.topbar + .ascii{margin-top:6px}

/* ---- cv section index: the tall page needs a way in other than scrolling ---- */
.jump{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 8px;font-size:14px}
.jump a{color:var(--dim);border-bottom:1px dotted var(--rule)}
.jump a:hover{color:var(--accent-text);border-bottom-color:var(--accent-text)}
.block{scroll-margin-top:24px}
.totop a{color:var(--muted);border-bottom:none}
.totop a:hover{color:var(--accent-text)}
</style>
